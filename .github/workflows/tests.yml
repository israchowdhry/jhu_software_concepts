name: Module 5 and 6 CI (Step 7)

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: module_5

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (module_5)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # 1) Run Pylint and fail if score < 10  (NOW module_6)
      - name: Pylint (module_6, fail-under=10)
        working-directory: module_6
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pylint src --fail-under=10

      # Ensure Postgres client tools exist (pg_isready)
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && exit 0
            sleep 1
          done
          echo "Postgres did not become ready in time"
          exit 1

      # 2) Run tests (pytest.ini enforces cov-fail-under=100)  (NOW module_6)
      - name: Pytest (module_6)
        working-directory: module_6
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pytest

      # 3) Generate dependency.svg using pydeps + Graphviz and fail if missing (still module_5)
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Generate dependency.svg (pydeps)
        run: |
          pydeps src --noshow -T svg -o dependency.svg
          test -f dependency.svg

      - name: Upload dependency.svg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: module_5/dependency.svg

      # 4) Run snyk test (dependency scan) (still module_5)
      - name: Set up Node (for Snyk)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk test (dependencies)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=requirements.txt
