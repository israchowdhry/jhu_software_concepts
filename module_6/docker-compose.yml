services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15

  seed:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_JSON: ${SEED_JSON}
    volumes:
      - ./src/data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    command: [ "python", "-c", "from src.db.load_data import load_data; import os; load_data(os.environ.get('SEED_JSON','/data/llm_extend_applicant_data.jsonl'))" ]
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    environment:
      FLASK_ENV: ${FLASK_ENV}
      FLASK_SECRET: ${FLASK_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    ports:
      - "8080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      SEED_JSON: ${SEED_JSON}
      TARGET_TABLE: ${TARGET_TABLE}
      ID_KEY: ${ID_KEY}
    volumes:
      - ./src/data:/data:ro
    depends_on:
      seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
